name: Reusable ArtCraft Android build and release

on:
  workflow_call:
    inputs:
      app:
        description: Central app profile slug (gridcraft or photocraft)
        required: true
        type: string
      common_ref:
        description: Full immutable commit SHA of this Common repository used by the caller
        required: true
        type: string
      source_version:
        description: Upstream source selector when no pinned source commit is configured
        required: false
        default: stable
        type: string
      build_mode:
        description: Debug creates a test APK; release requires the permanent app signing key and publishes the fixed Release asset
        required: false
        default: debug
        type: string
      builder_ref:
        description: Immutable ArtCraft Android Builder git commit or tag
        required: false
        default: 2a03bb11c4d08e8ca3a5c96dc9fd942cbe7c29a9
        type: string
    secrets:
      ARTCRAFT_SIGNING_KEYSTORE_BASE64:
        required: false
      ARTCRAFT_SIGNING_PASSWORD:
        required: false
      ARTCRAFT_EXPECTED_CERT_SHA256:
        required: false

permissions:
  contents: write

concurrency:
  group: artcraft-${{ inputs.app }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.app }} (${{ inputs.build_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_DEBUG: "false"

    steps:
      - name: Check out the shared infrastructure at this workflow's exact revision
        uses: actions/checkout@v4
        with:
          repository: a0534186049-byte/ArtCraft-Android-Common
          ref: ${{ inputs.common_ref }}
          path: common
          persist-credentials: false

      - name: Load and validate the central app profile
        id: profile
        env:
          APP: ${{ inputs.app }}
          COMMON_REF: ${{ inputs.common_ref }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMON_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::common_ref must be a full 40-character commit SHA."
            exit 2
          }
          python3 common/scripts/load-app-profile.py "$APP"

      - name: Check out the pinned ArtCraft Android Builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: ${{ inputs.builder_ref }}
          path: builder
          persist-credentials: false

      - name: Check out the app repository for its Android-only patches
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: app-project
          persist-credentials: false

      - name: Check out an app-specific immutable source commit when configured
        env:
          APP: ${{ steps.profile.outputs.app }}
          SOURCE_REPOSITORY: ${{ steps.profile.outputs.android_source_repository }}
          SOURCE_COMMIT: ${{ steps.profile.outputs.android_source_commit }}
          UPSTREAM_REPOSITORY: ${{ steps.profile.outputs.upstream_repository }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$SOURCE_COMMIT" ]]; then
            echo "No app-specific source pin; the builder will resolve the selected upstream stable/main source."
            exit 0
          fi
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid pinned source SHA."; exit 1; }
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "::error::Invalid pinned source repository."
            exit 1
          }
          DEST="$GITHUB_WORKSPACE/builder/source/$APP"
          mkdir -p "$GITHUB_WORKSPACE/builder/source"
          git clone --filter=blob:none --no-checkout "https://github.com/$SOURCE_REPOSITORY.git" "$DEST"
          git -C "$DEST" fetch --depth=1 origin "$SOURCE_COMMIT"
          git -C "$DEST" checkout --detach FETCH_HEAD
          ACTUAL="$(git -C "$DEST" rev-parse HEAD)"
          [[ "$ACTUAL" == "$SOURCE_COMMIT" ]] || {
            echo "::error::Pinned source SHA mismatch: expected $SOURCE_COMMIT, got $ACTUAL."
            exit 1
          }
          # The builder verifies the source checkout against the canonical upstream origin.
          git -C "$DEST" remote set-url origin "$UPSTREAM_REPOSITORY.git"
          echo "Checked out immutable app source $SOURCE_REPOSITORY@$SOURCE_COMMIT."

      - name: Apply app-specific Android port patches
        env:
          APP: ${{ steps.profile.outputs.app }}
        run: |
          set -Eeuo pipefail
          PATCH_SCRIPT="app-project/scripts/prepare-${APP}-android.py"
          if [[ -f "$PATCH_SCRIPT" ]]; then
            python3 "$PATCH_SCRIPT" "$GITHUB_WORKSPACE/builder/source/$APP"
          else
            echo "No app-specific Android port patch script for $APP."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder Python dependency
        run: python -m pip install --upgrade pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Java for the Android builder
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /opt/jdk
          sudo ln -sfn "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Run GridCraft Hebrew and RTL regression tests
        if: inputs.app == 'gridcraft'
        working-directory: builder/source/gridcraft
        run: |
          set -Eeuo pipefail
          cargo fmt --all
          cargo test -p gridcraft-engine --test it a_pathless_imported_workbook_does_not_follow_interface_direction
          cargo test -p gridcraft-engine --test it direction_sync_waits_for_an_open_undo_group_and_stays_clean_after_rollback
          cargo test -p gridcraft-ui-egui --lib only_right_to_left_languages_mirror_the_tab_row
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cargo xtask i18n-report 2>&1 | tee "$GITHUB_WORKSPACE/logs/gridcraft-hebrew-i18n-report.txt"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.9.0"

      - name: Cache Rust compiler artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ inputs.app }}-${{ inputs.builder_ref }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ inputs.app }}-${{ inputs.builder_ref }}-
            sccache-${{ runner.os }}-${{ inputs.app }}-

      - name: Cache Cargo and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: artcraft-deps-${{ runner.os }}-${{ inputs.app }}-${{ inputs.builder_ref }}
          restore-keys: |
            artcraft-deps-${{ runner.os }}-${{ inputs.app }}-

      - name: Install cargo-ndk
        run: |
          set -Eeuo pipefail
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            mkdir -p "$HOME/.cargo/bin"
            curl -fsSL https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-musl-v4.1.2.tgz |
              tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
            chmod +x "$HOME/.cargo/bin/cargo-ndk"*
          fi
          cargo ndk -V

      - name: Configure Android SDK and NDK
        run: |
          set -Eeuo pipefail
          [[ -n "$ANDROID_HOME" && -d "$ANDROID_HOME" ]] || { echo "::error::Android SDK is not configured on this runner."; exit 1; }
          if [[ -d "$ANDROID_HOME/ndk/27.2.12479018" ]]; then
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          else
            NDK="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          fi
          [[ -n "$NDK" && -d "$NDK" ]] || { echo "::error::Android NDK was not found."; exit 1; }
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "NDK_HOME=$NDK"
            echo "ARTCRAFT_BUILD_TOOLS_VERSION=35.0.0"
          } >> "$GITHUB_ENV"

      - name: Restore this app's permanent signing key
        if: inputs.build_mode == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ARTCRAFT_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_INPUT: ${{ secrets.ARTCRAFT_SIGNING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD_INPUT" ]] || {
            echo "::error::Release builds require ARTCRAFT_SIGNING_KEYSTORE_BASE64 and ARTCRAFT_SIGNING_PASSWORD in the app repository."
            exit 1
          }
          PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD_INPUT" | tr -d '\r\n')"
          mkdir -p builder/keys
          chmod 700 builder/keys
          printf '%s' "$KEYSTORE_B64" | base64 --decode > builder/keys/artcraft-builder.jks
          printf '%s' "$PASSWORD" > builder/keys/.keystore-password
          chmod 600 builder/keys/artcraft-builder.jks builder/keys/.keystore-password
          keytool -list -keystore builder/keys/artcraft-builder.jks -storepass "$PASSWORD" -alias artcraftbuilder >/dev/null
          echo "Persistent app signing key restored."

      - name: Validate build mode and build the Android APK
        env:
          APP: ${{ steps.profile.outputs.app }}
          DISPLAY_NAME: ${{ steps.profile.outputs.display_name }}
          APPLICATION_ID: ${{ steps.profile.outputs.application_id }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          SOURCE_COMMIT: ${{ steps.profile.outputs.android_source_commit }}
          BUILD_MODE: ${{ inputs.build_mode }}
        run: |
          set -Eeuo pipefail
          [[ "$BUILD_MODE" == "debug" || "$BUILD_MODE" == "release" ]] || {
            echo "::error::build_mode must be debug or release."
            exit 2
          }
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cd "$GITHUB_WORKSPACE/builder"
          set -o pipefail
          if [[ -n "$SOURCE_COMMIT" ]]; then
            SOURCE_FLAG="-noupdate"
          else
            case "$SOURCE_VERSION" in
              stable) SOURCE_FLAG="-stable" ;;
              main) SOURCE_FLAG="-main" ;;
              *) echo "::error::source_version must be stable or main."; exit 2 ;;
            esac
          fi
          if [[ "$BUILD_MODE" == "release" ]]; then
            bash build.sh "-$APP" "$SOURCE_FLAG" "-appname=$DISPLAY_NAME" "-packagename=$APPLICATION_ID" 2>&1 |
              tee "$GITHUB_WORKSPACE/logs/$APP-build.log"
          else
            bash build-debug.sh "-$APP" "$SOURCE_FLAG" "-appname=$DISPLAY_NAME" "-packagename=$APPLICATION_ID" 2>&1 |
              tee "$GITHUB_WORKSPACE/logs/$APP-build.log"
          fi

      - name: Verify APK package, signature and integrity
        id: verify
        env:
          APP: ${{ steps.profile.outputs.app }}
          APPLICATION_ID: ${{ steps.profile.outputs.application_id }}
          ASSET_NAME: ${{ steps.profile.outputs.release_asset_name }}
          BUILD_MODE: ${{ inputs.build_mode }}
          EXPECTED_CERT: ${{ secrets.ARTCRAFT_EXPECTED_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          APKS=( "$GITHUB_WORKSPACE"/builder/output/"$APP"-*.apk )
          if [[ ${#APKS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one $BUILD_MODE APK for $APP; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          if [[ "$BUILD_MODE" == "debug" ]]; then
            ASSET_NAME="${ASSET_NAME%.apk}-debug.apk"
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp -- "${APKS[0]}" "$GITHUB_WORKSPACE/release/$ASSET_NAME"
          bash common/scripts/verify-apk.sh "$GITHUB_WORKSPACE/release/$ASSET_NAME" "$APPLICATION_ID" "$EXPECTED_CERT"
          echo "apk_path=$GITHUB_WORKSPACE/release/$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.profile.outputs.app }}-${{ inputs.build_mode }}-apk-backup
          path: ${{ steps.verify.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create or update the fixed app Release
        if: inputs.build_mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.profile.outputs.release_tag }}
          DISPLAY_NAME: ${{ steps.profile.outputs.display_name }}
          ASSET_NAME: ${{ steps.verify.outputs.asset_name }}
        run: |
          set -Eeuo pipefail
          ASSET="$GITHUB_WORKSPACE/release/$ASSET_NAME"
          [[ -s "$ASSET" ]] || { echo "::error::Verified APK asset is missing."; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$DISPLAY_NAME - latest Android APK" \
              --notes "Latest verified Android APK. Subsequent successful builds replace this asset in the same Release."
          fi

      - name: Verify that the APK is present in Release Assets
        if: inputs.build_mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.profile.outputs.release_tag }}
          ASSET_NAME: ${{ steps.verify.outputs.asset_name }}
        run: |
          set -Eeuo pipefail
          RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          URL="$(printf '%s' "$RESPONSE" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .browser_download_url' | head -n 1)"
          REMOTE_SIZE="$(printf '%s' "$RESPONSE" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .size' | head -n 1)"
          LOCAL_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/release/$ASSET_NAME")"
          [[ -n "$URL" && "$URL" != "null" ]] || { echo "::error::APK asset not found in Release Assets."; exit 1; }
          [[ "$REMOTE_SIZE" == "$LOCAL_SIZE" ]] || {
            echo "::error::Release APK size mismatch (local=$LOCAL_SIZE, remote=$REMOTE_SIZE)."
            exit 1
          }
          echo "Verified published APK asset: $URL"
          echo "Direct APK download: $URL"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-build-log
          path: logs/*-build.log
          if-no-files-found: ignore
          retention-days: 14
